version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '5001:5001'
    environment:
      - NODE_ENV=development
    env_file:
      - .env
    volumes:
      # Mount source for hot-reload in dev (override CMD below)
      - .:/app
      - /app/node_modules   # keep container node_modules intact
      - ./logs:/app/logs
    command: npm run dev
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:5001/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
